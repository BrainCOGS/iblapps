# Files added by BrainCOGS (not present upstream). Even the few upstream files we
# edited (ephys_atlas_gui.py etc.) are left alone: formatting them rewrites
# hundreds of lines in files upstream actively changes.
# Whitespace fixers and the formatter only touch these: this fork tracks
# int-brain-lab/iblapps, and fixing the whole tree (incl. a 99k-line root.obj with
# CRLF endings) would make merging upstream hard.
x-own: &own '^(\.github/.*|\.pre-commit-config\.yaml|pyproject\.toml|tests/(conftest|test_import)\.py)$'

# `prek install` also installs the commit-msg hook (default_install_hook_types).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, pre-merge-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: end-of-file-fixer
        files: *own
      - id: mixed-line-ending
        files: *own
      - id: trailing-whitespace
        files: *own

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --show-fixes]
      # Formatting the whole tree rewrites 64 of 77 files; only format owned files.
      - id: ruff-format
        files: *own

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.22
    hooks:
      - id: uv-lock

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: local
    hooks:
      # One spelling for AI attribution, so `git log --grep='^Assisted-by: '`
      # finds every AI-assisted commit: `Assisted-by: ClaudeCode:<model id>`,
      # with the exact model id (claude-opus-5-5, not claude-opus-5.5 or
      # "Claude Code:Opus 5"). Claude is never listed as a co-author.
      - id: ai-trailer
        name: 'AI trailer is "Assisted-by: ClaudeCode:<model id>"'
        language: pygrep
        entry: '^(?:(?!Assisted-by: ClaudeCode:claude-[a-z]+(?:-[0-9]+)+$)(?i:assisted[-_ ]?by)\s*:|(?i:co-authored[-_ ]?by)\s*:.*(?i:claude|anthropic))'
        stages: [commit-msg]
