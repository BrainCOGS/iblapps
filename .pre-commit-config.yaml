# Files added by BrainCOGS (not present upstream). Even the few upstream files we
# edited (ephys_atlas_gui.py etc.) are left alone: formatting them rewrites
# hundreds of lines in files upstream actively changes.
# Whitespace fixers and the formatter only touch these: this fork tracks
# int-brain-lab/iblapps, and fixing the whole tree (incl. a 99k-line root.obj with
# CRLF endings) would make merging upstream hard.
x-own: &own '^(\.github/.*|\.pre-commit-config\.yaml|pyproject\.toml|tests/(conftest|test_import)\.py)$'

# `prek install` also installs the commit-msg hook (default_install_hook_types).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, pre-merge-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: end-of-file-fixer
        files: *own
      - id: mixed-line-ending
        files: *own
      - id: trailing-whitespace
        files: *own

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --show-fixes]
      # Formatting the whole tree rewrites 64 of 77 files; only format owned files.
      - id: ruff-format
        files: *own

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans only the changes being introduced: the staged changes (or a
      # merge's own changes) on commit, the commits of the PR in CI (lint workflow).
      - id: gitleaks
        entry: .github/scripts/gitleaks-changes.sh

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.22
    hooks:
      - id: uv-lock

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: local
    hooks:
      # Humans author commits; AI help is disclosed with one
      # `Assisted-by: <Harness>:<model>` trailer per agent, and no AI agent is the
      # author, committer or a Co-authored-by. Vendored from agent-tooling
      # (hooks/check_ai_attribution.py, with its tests); CI runs it on every
      # commit of a PR or push (lint.yml).
      - id: ai-attribution
        name: AI attribution (Assisted-by trailer, no AI authors)
        language: python
        entry: python .github/scripts/check_ai_attribution.py
        stages: [commit-msg]
