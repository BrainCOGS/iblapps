[tool.ruff.format]
quote-style = "preserve"  # upstream mixes quote styles

[tool.pytest.ini_options]
minversion = "9.0"
# pytest 9 requires "args"-type options to be a real TOML list.
addopts = ["-ra", "--showlocals", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
log_level = "INFO"
testpaths = ["tests"]
filterwarnings = ["error"]
