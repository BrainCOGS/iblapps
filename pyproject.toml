[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Version, dependencies (requirements.txt), packages and entry points are
# still defined in setup.py, which is kept as-is to stay close to upstream.
[project]
name = "iblapps"
requires-python = ">=3.10"
dynamic = ["version", "dependencies", "scripts"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
# Quarantine: ignore releases newer than 7 days (supply-chain protection).
exclude-newer = "7 days"

[tool.ruff]
# Mirrors upstream's .flake8 (max-line-length = 99; W504 has no ruff equivalent).
line-length = 99
extend-exclude = [
    "__init__.py",
    "data_exploration_gui",
    "launch_phy",
    "histology",
    "qt_matplotlib.py",
    "*.ipynb",
]

[tool.ruff.lint]
# Full rule set (same as tech_calendar_streamlit). `extend-select` keeps ruff's
# defaults (E4, E7, E9, F).
extend-select = [
    "A",    # flake8-builtins: shadowing built-ins
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "T100", # leftover breakpoints / debugger calls
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
]
ignore = ["N815", "A002", "N806"]  # reference ignores: mixedCase class attrs, arg shadows builtin, non-lowercase local var

[tool.ruff.lint.per-file-ignores]
# This fork tracks int-brain-lab/iblapps, so the full rule set is applied only to
# files added by BrainCOGS (tests/conftest.py, tests/test_import.py). Upstream
# files keep a minimal set (E9 + F minus the noisy F401/F541/F811/F841): rewriting
# them to satisfy the new rules would make merging upstream/master painful. The
# list below ignores every other rule family that ruff 0.16 enables by default or
# that we extend-select. Remove an entry only if the fork diverges from upstream.
"{atlaselectrophysiology,atlasview,dlc,ephysfeatures,mesoscope_gui,needles2,qt_helpers,viewspikes}/**" = [
